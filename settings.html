<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>连接设置</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="settings">
  <div class="shead">⚙️ 商家设置</div>

  <div class="ok-banner" id="cfgStatus">Supabase 连接：检测中…</div>

  <div class="scard">
    <div class="sec-title">① Supabase 数据库（已自动配置，无需填写）</div>
    <label>Project URL</label>
    <input id="url" placeholder="https://xxxx.supabase.co" autocomplete="off" spellcheck="false" readonly />

    <label>anon public key</label>
    <input id="key" placeholder="eyJhbGciOi..." autocomplete="off" spellcheck="false" readonly />

    <div class="hint">
      上面的配置已经<b>写进网站代码</b>并部署好了，顾客扫码即用，<b>你一般不用动它</b>。<br />
      只有在你想<b>切换到另一个 Supabase 项目</b>时，才需要取消只读、改完点「保存并连接」。
    </div>

    <button class="submit" id="editCfgBtn">修改 Supabase 配置</button>
    <button class="submit hidden" id="saveBtn">保存并连接</button>
    <button class="btn-ghost hidden" id="testBtn">仅测试连接</button>
    <div id="msg"></div>
  </div>

  <div class="scard">
    <div class="sec-title">② 收款码（顾客付款时显示的二维码）</div>
    <label>收款码（顾客扫码付款的二维码图片）</label>
    <input id="payQrFile" type="file" accept="image/*" />
    <div id="payQrPreview" class="qr-preview"></div>
    <label>收款码说明（可选，如：微信收款 / 支付宝收款）</label>
    <input id="payTitle" placeholder="微信收款" autocomplete="off" spellcheck="false" />
    <div class="hint">
      上传你自己的微信/支付宝<b>收款码</b>图片。顾客点「去支付」会看到此码，付款后点「我已支付」即出取单号。<br />
      图片直接存进站点配置（数据库），<b>无需新建存储桶</b>，所有顾客手机都能看到，无需逐台设置。<br />
      <b>提示：</b>如果医院/食堂已有现成的收款码图片，直接选图上传即可；服务器在哪个地区都不影响。
    </div>
    <button class="submit" id="saveQrBtn">上传并保存收款码</button>
    <div id="qrMsg"></div>
  </div>

  <a class="back" href="index.html">← 返回点餐</a>

  <script type="module" src="js/settings.js"></script>
</body>
</html>
