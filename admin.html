<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>菜单后台管理</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { max-width: 720px; padding-bottom: 80px; }
    .admin-head { position: sticky; top: 0; z-index: 10; background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    .admin-head .t { font-size: 17px; font-weight: 700; }
    .admin-head button { background: rgba(255,255,255,0.22); border: none; color: #fff; padding: 8px 16px; border-radius: 999px; font-weight: 700; cursor: pointer; }
    .cat-card { background: var(--card); margin: 12px; border-radius: 14px; box-shadow: var(--shadow); padding: 12px; }
    .cat-card > .cat-name { width: 100%; font-size: 16px; font-weight: 700; border: none; border-bottom: 2px solid var(--line); padding: 6px 0; margin-bottom: 10px; outline: none; }
    .it-row { display: grid; grid-template-columns: 40px 1fr 80px 32px; gap: 6px; align-items: center; margin-bottom: 8px; }
    .it-row input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; width: 100%; }
    .it-row .emoji-in { text-align: center; font-size: 20px; }
    .it-row .del { background: #ffe9e3; color: var(--brand); border: none; border-radius: 8px; height: 32px; cursor: pointer; }
    .it-row .desc-in { grid-column: 1 / 4; }
    .it-row .img-in { grid-column: 1 / 5; }
    .add-it, .add-cat { display: inline-block; margin: 6px 12px; background: var(--bg); border: 1px dashed var(--brand); color: var(--brand); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; }
    .save-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 720px; background: #2b2f36; padding: 10px 16px; display: flex; gap: 10px; }
    .save-bar button { flex: 1; border: none; border-radius: 999px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .save-bar .sv { background: var(--brand); color: #fff; }
    .save-bar .rst { background: #555b63; color: #fff; }
    .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: #34c759; color: #fff; padding: 8px 18px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; z-index: 50; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body class="admin">
  <div class="admin-head">
    <div class="t">🛠️ 菜单后台</div>
    <button id="saveTop">保存</button>
  </div>
  <div id="cats"></div>
  <span class="add-cat" id="addCat">+ 新增分类</span>

  <div class="save-bar">
    <button class="rst" id="resetBtn">重置</button>
    <button class="sv" id="saveBtn">保存并同步到前台</button>
  </div>
  <div class="toast" id="toast">已保存</div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
